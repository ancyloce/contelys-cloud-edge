# Edge's defaults: every value that the renderer needs (Edge detailed design, section 05).
# Ticket 03 of the Edge implementation plan set them on 2026-11-23, and the renderer embeds this
# file (Edge ADR 0002). Every value is provisional: production values come from measuring tail
# latency, false rejections, peak concurrency and resource use (section 05).
status: provisional

# The largest group of users expected behind one client address. The per-address limits and the
# local flood limits admit it, and V22 runs with it.
group_behind_one_address: 250

# Identity's values, provisional until Identity's OpenAPI contract states them (section 13).
identity:
  authentication_path: /internal/v1/authentication
  limit_key_header: X-Contelys-Limit-Key
  limit_key_max_bytes: 64
  deadline_ms: 250
  internal_token_max_bytes: 1024

# The ports of an Edge instance's listeners (section 02). The external and internal listeners speak
# TLS, the loopback listener plain HTTP on 127.0.0.1, and the control listener carries the Control API.
listeners:
  external_port: 9443
  internal_port: 9444
  loopback_port: 9080
  control_port: 9090

# The Strict-Transport-Security header of every external route (section 06): one year, for the
# application hostname alone.
strict_transport_security: max-age=31536000

# Values of a whole Edge instance, rendered into config.yaml (section 06).
instance:
  # Process and connection limits: one worker per CPU, and APISIX's own defaults for the rest.
  worker_processes: auto
  worker_connections: 10620
  worker_rlimit_nofile: 20480
  client_header_buffer_size: 4k
  large_client_header_buffers: 4 16k
  proxy_buffer_size: 16k
  # The drain limit of a restart. The three settings must agree, and Docker outlasts nginx (section 08).
  drain:
    worker_shutdown_timeout_s: 120
    container_stop_timeout_s: 125
    ansible_wait_s: 125

# The local flood limits of every external route, per client address and instance, applied before
# the call to Identity (section 05).
local_flood:
  requests_per_second: 300
  burst: 600
  connections: 1000

# The traffic classes (section 05). Every shared limit counts over a window of 60 s, and every class
# with a shared limit waits at most 100 ms for Valkey before the limit lets requests pass.
traffic_classes:
  authentication:
    identity_call_timeout_ms: 2000
    loopback_timeouts_ms: {connect: 1000, send: 3000, read: 3000}
    upstream_timeouts_ms: {connect: 2000, send: 10000, read: 10000}
    body_max_bytes: 65536
    per_address_requests_per_window: 1500
    window_s: 60
    valkey_timeout_ms: 100
  api:
    upstream_timeouts_ms: {connect: 2000, send: 30000, read: 30000}
    body_max_bytes: 8388608
    per_caller_requests_per_window: 600
    per_address_requests_per_window: 6000
    window_s: 60
    valkey_timeout_ms: 100
  websocket:
    upstream_timeouts_ms: {connect: 2000}
    idle_timeout_s: 300
    per_caller_handshakes_per_window: 30
    connections_per_address: 500
    window_s: 60
    valkey_timeout_ms: 100
  transfer:
    upstream_timeouts_ms: {connect: 2000, send: 120000, read: 120000}
    upload_max_bytes: 536870912
    concurrent_uploads_per_address: 50
    concurrent_downloads_per_address: 100
    per_caller_requests_per_window: 120
    window_s: 60
    valkey_timeout_ms: 100
